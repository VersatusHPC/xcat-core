# The Apache configuration for the xCAT REST API, for every RPM family.
#
# There is no LoadModule here. A LoadModule must name one distribution's module
# directory, and the file is then absent on the others, which stops Apache from
# starting. EL and openEuler load mod_rewrite in conf.modules.d; on SUSE the
# %post scriptlet runs a2enmod rewrite.

# Redirect all http requests to https. mod_rewrite can still be absent, so the
# redirect is guarded: without the guard Apache refuses to start.
<IfModule mod_rewrite.c>
RewriteEngine On
RewriteCond %{SERVER_PORT} 80
RewriteCond %{HTTPS} !=on
RewriteRule ^/?xcatws/(.*) https://%{SERVER_NAME}/xcatws/$1 [R,L]
RewriteRule ^/?xcatwsv2/(.*) https://%{SERVER_NAME}/xcatwsv2/$1 [R,L]
</IfModule>

<FilesMatch "^(xcatws.cgi|zvmxcatws.cgi)$">
# mod_authz_core arrived in Apache 2.4. Both spellings are present so one file
# serves both generations and no scriptlet has to replace it after the install.
<IfModule mod_authz_core.c>
Require all granted
</IfModule>
<IfModule !mod_authz_core.c>
Order allow,deny
Allow from all
</IfModule>
</FilesMatch>
